<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venda seu carro aqui!</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Div que vai conter todos os elementos do site -->
    <div class="container">
        <div class="header">
            <h3>Cadastre seu veículo para vender mais rápido!</h3>
        </div>
        <!-- Div que encapsula todos os elementos do formulário -->
        <div class="form-container">
            <!-- cabeçalho do formulário -->
            <div class="form-header">
                <p>Formulário</p>
            </div>
            <!-- corpo do formulário -->
            <div class="form-body">
                <h1 class="form-title">Venda fácil seu carro!</h1>
                <p>Descreva as características e marque os opcionais que ele possui.</p>
                <!-- formulário que será preenchido -->
                <form>
                    <!-- div box que encapsula o campo de título  -->
                    <div class="box-input">
                        <!-- campo de título do anúncio -->
                        <label for="title">Título do anúncio<span class="required-field">*</span></label>
                        <!-- minlength e maxlength são usados para definir o mínimo e máximo de caracteres do campo -->
                         <!-- class block é apenas para indicar no CSS -->
                        <input type="text" id="title" name="title" class="block" placeholder="Nome do seu veículo" minlength="1" maxlength="30" required>
                    </div>
                     <div class="box-input">
                        <label for="price">Preço de venda do veículo<span class="required-field">*</span></label>
                        <input 
                            type="number" 
                            id="price" 
                            name="price" 
                            class="block" 
                            placeholder="defina o preço" 
                            required
                        />
                    </div>
                    <div class="box-input">
                        <label for="description">Preço de venda do veículo<span class="required-field">*</span></label>
                        <textarea class="block" name="description" id="description" placeholder="Aqui você irá colocar os detalhes do seu carro, por exemplo se ele possui algum risco ou defeito"></textarea>
                    </div>
                    <div class="box-input">
                        <label for="brand">Marca do veículo<span class="required-field">*</span></label>
                        <input 
                            type="text" 
                            id="brand" 
                            name="brand" 
                            class="block" 
                            placeholder="Digite a marca do veículo" 
                            required
                        />
                    </div>
                    <div class="box-input">
                        <label for="model">Modelo do veículo<span class="required-field">*</span></label>
                        <input 
                            type="text" 
                            id="model" 
                            name="model" 
                            class="block" 
                            placeholder="Digite o modelo do veículo" 
                            required
                        />
                    </div>
                    <div class="box-input">
                        <label for="mileage">Kilometragem<span class="required-field">*</span></label>
                        <input 
                            type="number" 
                            id="mileage" 
                            name="mileage" 
                            class="block" 
                            placeholder="Digite quantos Km rodados o veículo possui" 
                            required
                        />
                    </div>
                    <div class="box-input">
                        <label for="puchasedate">Data de compra<span class="required-field">*</span></label>
                        <input 
                            type="date" 
                            id="puchasedate" 
                            name="puchasedate" 
                            class="block" 
                            required
                        />
                    </div>
                    <div class="box-input">
                        <p>Tipo de câmbio:<span class="required-field">*</span></p>
                        <input type="radio" id="manual" name="gear" />
                        <label for="manual">Manual</label>
                        <input type="radio" id="automatico" name="gear" />
                        <label for="automatico">Automático</label>
                    </div>
                    <div class="optional-box">
                       <p>Opcionais</p>
                       <ul class="optional-list">
                        <li>
                            <input type="checkbox" id="airbag" name="optional[]" value="airbag">
                            <label for="airbag">Airbag</label>
                        </li>
                        <li>
                            <input type="checkbox" id="alarm" name="optional[]" value="alarm">
                            <label for="alarm">Alarme</label>
                        </li>
                        <li>
                            <input type="checkbox" id="ac" name="optional[]" value="ac">
                            <label for="ac">Ar condicionado</label>
                        </li>
                        <li>
                            <input type="checkbox" id="reverse_camera" name="optional[]" value="reverse_camera">
                            <label for="reverse_camera">Câmera de ré</label>
                        </li>
                       </ul>
                    </div>
                    <div class="optional-box">
                       <ul class="optional-list">
                        <li>
                            <input type="checkbox" id="lane_assist" name="optional[]" value="lane_assist">
                            <label for="lane_assist">Assistente de pista</label>
                        </li>
                        <li>
                            <input type="checkbox" id="keyless" name="optional[]" value="keyless">
                            <label for="keyless">Partida sem chave</label>
                        </li>
                        <li>
                            <input type="checkbox" id="smartphone" name="optional[]" value="smartphone">
                            <label for="smartphone">Integração com celular
                        <li>
                            <input type="checkbox" id="leather_sit" name="optional[]" value="leather_sit">
                            <label for="leather_sit">Banco de couro</label>
                        </li>
                       </ul>
                    </div>
                    <div class="box-input">
                        <p>Imagens do seu veículo<span class="required-field">*</span></p>
                        <input 
                            type="file" 
                            id="images" 
                            name="images" 
                            multiple
                            accept="image/png, image/jpg" 
                            required
                        />
                    </div>
                    <!-- botão para enviar o formulário -->
                    <input type="submit" value="Enviar anúncio" class="btn-submit">
                </form>
            </div>
        </div>
    </div>
</body>
</html>
