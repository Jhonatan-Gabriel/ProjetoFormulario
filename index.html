<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venda seu carro aqui!</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Div que vai conter todos os elementos do site -->
    <div class="container">
        <div class="header">
            <h3>Cadastre seu veículo para vender mais rápido!</h3>
        </div>
        <!-- Div que encapsula todos os elementos do formulário -->
        <div class="form-container">
            <!-- cabeçalho do formulário -->
            <div class="form-header">
                <p>Formulário</p>
            </div>
            <!-- corpo do formulário -->
            <div class="form-body">
                <h1 class="form-title">Venda fácil seu carro!</h1>
                <p>Descreva as características e marque os opcionais que ele possui.</p>
                <form>
                    <div class="box-input">
                        <label for="title">Título do anúncio<span class="required-field">*</span></label>
                        <input type="text" id="title" name="title" class="block" placeholder="Nome do seu veículo" minlength="1" maxlength="30" required>
                    </div>
                    <input type="submit" value="Enviar anúncio">
                </form>
            </div>
        </div>
    </div>
</body>
</html>
